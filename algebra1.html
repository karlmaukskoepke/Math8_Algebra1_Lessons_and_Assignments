<!doctype html>
<html lang="en" data-class="algebra1" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mr. Mauks - Algebra 1</title>
<meta name="description" content="Lessons, homework, and links for Algebra 1 with Mr. Mauks.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📐%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&family=Permanent+Marker&family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('mauks-theme')==='light'?'light':'dark')}catch(e){}</script>
</head>
<body>
<a class="skip" href="#lesson">Skip to the lesson</a>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Mr. Mauks home">Mr. Mauks</a>
    <div class="tools">
      <a class="chip" href="math8.html">Switch to Math 8</a>
      <button class="chip" id="theme-toggle" type="button">Light mode</button>
    </div>
  </header>

  <main>
    <div class="page-head">
      <h1>Algebra 1</h1>
      <p class="today-line" id="today-line"></p>
      <p class="notice hidden" id="notice" role="status"></p>
    </div>

    <div class="strip-wrap" id="lesson-top">
      <button class="nav-btn" id="strip-left" type="button" aria-label="Earlier days">&#8249;</button>
      <div class="strip" id="strip" role="group" aria-label="Choose a day"></div>
      <button class="nav-btn" id="strip-right" type="button" aria-label="Later days">&#8250;</button>
    </div>

    <article class="lesson" id="lesson" aria-live="polite">
      <p class="empty">Loading the lesson...</p>
    </article>
    <noscript><p class="notice">This page needs JavaScript to show lessons.</p></noscript>

    <section class="section ahead-wrap hidden" id="ahead-wrap" aria-labelledby="ahead-h">
      <h2 id="ahead-h">Look ahead</h2>
      <div class="ahead" id="ahead"></div>
    </section>

    <div id="link-sections"></div>

    <section class="section archive" aria-labelledby="archive-h">
      <h2 id="archive-h">All lessons</h2>
      <p class="sub">Missed a day? Search or scroll back to any past lesson.</p>
      <div class="archive-controls">
        <input id="archive-q" type="search" placeholder="Search lessons, like &quot;slope&quot; or &quot;quiz&quot;" aria-label="Search all lessons" autocomplete="off">
        <span class="count" id="archive-count" aria-live="polite"></span>
      </div>
      <div id="archive-list"></div>
    </section>
  </main>

  <footer class="footer">
    <span>Made by Mr. Mauks</span>
    <span id="updated"></span>
  </footer>
</div>
<script src="js/config.js"></script>
<script src="js/sample-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
